# One-click deploy config for Render.com (render.com/docs/blueprint-spec).
# Push this repo to GitHub, then in Render: New + -> Blueprint -> pick the repo.
# Render reads this file, creates the service, and asks for the secret values below.
services:
  - type: web
    name: teamzero
    runtime: node
    plan: free                 # FREE — no card needed. Caveat: no persistent disk,
    buildCommand: "echo no build needed"   # so accounts/leads reset on restart/deploy,
    startCommand: "node server.js"         # and the service sleeps after ~15 min idle.
    # To make data persistent + always-on later: change plan to `starter`, add back a
    # disk block (name/mountPath: /app/data/sizeGB: 1), and redeploy. ~$7/mo.
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # you paste it in the Render dashboard
      - key: TEAMZERO_MODEL
        value: claude-sonnet-5
      - key: TEAMZERO_DRAFT_MODEL
        value: claude-haiku-4-5   # cheap tier for email drafting (3x cheaper)
      - key: OWNER_EMAILS
        value: btk18000@gmail.com # you get the product free
      - key: SESSION_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: APOLLO_API_KEY
        sync: false          # optional — verified emails; leave blank to skip
      - key: PUBLIC_URL
        sync: false          # set to your live https URL, e.g. https://teamzero.onrender.com
      - key: DEV_UNLOCK
        value: "0"
      - key: ALLOW_CLI_FALLBACK
        value: "0"
