# One-click deploy config for Render.com (render.com/docs/blueprint-spec).
# Push this repo to GitHub, then in Render: New + -> Blueprint -> pick the repo.
# Render reads this file, creates the service, and asks for the secret values below.
services:
  - type: web
    name: teamzero
    runtime: node
    plan: starter              # paid: always-on (no idle sleep)
    buildCommand: "echo no build needed"
    startCommand: "node server.js"
    # NOTE: the persistent disk is added MANUALLY in the Render dashboard
    # (Settings -> Disks -> Add Disk, mount path /app/data, 1GB). Render can't
    # add a disk to an existing service via blueprint sync, so it lives here as
    # a comment only — do not re-add a `disk:` block or the sync will fail again.
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # you paste it in the Render dashboard
      - key: TEAMZERO_MODEL
        value: claude-sonnet-5
      - key: TEAMZERO_DRAFT_MODEL
        value: claude-haiku-4-5   # cheap tier for email drafting (3x cheaper)
      - key: OWNER_EMAILS
        value: btk18000@gmail.com # you get the product free
      - key: DATA_DIR
        value: /app/data          # MUST match the disk's mount path (persistence)
      - key: SESSION_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: APOLLO_API_KEY
        sync: false          # optional — verified emails; leave blank to skip
      - key: PUBLIC_URL
        sync: false          # set to your live https URL, e.g. https://teamzero.onrender.com
      - key: DEV_UNLOCK
        value: "0"
      - key: ALLOW_CLI_FALLBACK
        value: "0"
